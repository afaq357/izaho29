/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    background: #fff;
}


/* =========================
   PROFILE
========================= */

.profile {
    text-align: center;
    padding: 28px 20px 18px;
}

.profile-image {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.18);
}

.name {
    margin-top: 12px;
    font-size: 24px;
    font-weight: 700;
}

.verified {
    color: #1877f2;
    font-size: 17px;
}

.location {
    margin-top: 6px;
    color: #777;
    font-size: 14px;
}

.rating {
    margin-top: 7px;
    color: #555;
    font-size: 14px;
}


/* =========================
   STATS
========================= */

.stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 15px 10px 20px;
    border-bottom: 1px solid #eee;
}

.stat {
    text-align: center;
    min-width: 80px;
}

.stat strong {
    display: block;
    font-size: 20px;
    font-weight: 700;
}

.stat span {
    color: #777;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
}

.stat-icon {
    font-size: 12px;
    line-height: 1;
}


/* =========================
   AD
========================= */

.ad-box {
    margin: 10px 20px 20px;
    min-height: 110px;
    border-radius: 12px;
    background: #eeeeee;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.ad-box a {
    display: block;
    line-height: 0;
}

.ad-box img {
    display: block;
    width: 305px;
    height: 99px;
    max-width: 100%;
    object-fit: contain;
}


/* =========================
   MAIN BUTTONS
========================= */

.buttons {
    display: flex;
    gap: 10px;
    padding: 0 20px;
}

.buttons button {
    flex: 1;
    border: none;
    padding: 13px 8px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.explicit {
    background: #222;
    color: #fff;
}

.live {
    background: #e53935;
    color: #fff;
}


/* =========================
   FEATURED SLIDER
========================= */

.featured {
    padding: 25px 20px 10px;
}

.featured-title {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 12px;
}

.slider {
    position: relative;
    width: 100%;
    height: 300px;
    overflow: hidden;
    border-radius: 14px;
    background: #eee;
}

.slide-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.slider-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: white;
    font-size: 24px;
    cursor: pointer;
    z-index: 5;
}

.prev {
    left: 10px;
}

.next {
    right: 10px;
}


/* =========================
   VIEW MORE
========================= */

.view-more {
    padding: 18px 20px 30px;
}

.join-button {
    width: 100%;
    border: none;
    background: #111;
    color: #fff;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}


/* =====================================================
   POPUP OVERLAY
===================================================== */

.overlay {
    display: none;

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.58);

    z-index: 99999;

    align-items: flex-start;
    justify-content: center;

    padding: 38px 15px 20px;

    overflow-y: auto;
}


/* =====================================================
   POPUP BOX
===================================================== */

.popup {
    position: relative;

    width: 100%;
    max-width: 507px;

    background: #fff;

    border-radius: 0;

    padding: 24px 40px 42px;

    text-align: center;

    box-shadow: 0 8px 30px rgba(0,0,0,0.25);

    animation: popupShow 0.2s ease-out;
}

@keyframes popupShow {

    from {
        transform: scale(0.96);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }

}


/* =====================================================
   POPUP CLOSE X
===================================================== */

.popup-close {

    position: absolute;

    right: -15px;
    top: -15px;

    width: 31px;
    height: 31px;

    border: 3px solid #fff;

    border-radius: 50%;

    background: #050505;

    color: #fff;

    font-size: 20px;

    line-height: 23px;

    font-weight: 400;

    padding: 0;

    cursor: pointer;

    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
}


/* =====================================================
   POPUP TITLE
===================================================== */

.popup-title {

    color: #12b96b;

    font-size: 28px;

    font-weight: 700;

    margin-bottom: 20px;
}


/* =====================================================
   POPUP DESCRIPTION
===================================================== */

.popup-description {

    color: #111;

    font-size: 18px;

    font-weight: 700;

    line-height: 1.4;

    margin-bottom: 14px;
}


/* =====================================================
   POPUP STEPS
===================================================== */

.steps {

    text-align: center;

    margin: 0 auto 26px;
}

.step {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    gap: 5px;

    color: #111;

    font-size: 18px;

    line-height: 1.7;

    margin-bottom: 2px;
}

.step span {

    flex-shrink: 0;
}


/* =====================================================
   POPUP BANNER
===================================================== */

.popup-banner {

    width: 100%;

    height: 145px;

    background: #f1f1f1;

    border-radius: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    margin: 8px 0 25px;

    overflow: hidden;
}

.banner-text {

    color: #222;

    font-size: 19px;
}
.popup-banner img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* =====================================================
   POPUP CONTINUE BUTTON
===================================================== */

.popup-continue {

    width: 100%;

    height: 82px;

    border: none;

    border-radius: 45px;

    background: #050505;

    color: #12b96b;

    font-size: 25px;

    font-weight: 700;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    cursor: pointer;

    box-shadow: 0 5px 15px rgba(0,0,0,0.18);
}

.lock-icon {

    font-size: 25px;
}


/* =====================================================
   MOBILE / IPAD
===================================================== */

@media (max-width: 600px) {

    .overlay {
        padding: 35px 15px 20px;
    }

    .popup {
        max-width: 500px;
        padding: 25px 32px 35px;
    }

    .popup-title {
        font-size: 27px;
    }

    .popup-description {
        font-size: 17px;
    }

    .step {
        font-size: 17px;
    }

    .popup-banner {
        height: 135px;
    }

    .popup-continue {
        height: 70px;
        font-size: 22px;
    }

}


@media (max-width: 400px) {

    .popup {
        padding: 22px 20px 28px;
    }

    .popup-title {
        font-size: 24px;
    }

    .popup-description {
        font-size: 15px;
    }

    .step {
        font-size: 15px;
    }

    .popup-banner {
        height: 115px;
    }

    .popup-continue {
        height: 62px;
        font-size: 19px;
    }

}

</style>

<script>


/* =====================================================
   POPUP FUNCTIONS
===================================================== */

function openPopup() {

    document.getElementById("popup").style.display = "flex";

}


function closePopup() {

    document.getElementById("popup").style.display = "none";

}


/* Close when clicking outside */

document.getElementById("popup").addEventListener("click", function(event) {

    if (event.target === this) {

        closePopup();

    }

});



/* =====================================================
   SLIDER
===================================================== */

const slides = [

    "iamge/images.jpg",

    "iamge/images (1).jpg",

    "iamge/images (2).jpg",

    "iamge/images (3).jpg"

];


let currentSlide = 0;



function showSlide(index) {

    if (index >= slides.length) {

        currentSlide = 0;

    }

    else if (index < 0) {

        currentSlide = slides.length - 1;

    }

    else {

        currentSlide = index;

    }


    document.getElementById("slideImage").src =
        slides[currentSlide];

}



function nextSlide() {

    showSlide(currentSlide + 1);

}



function prevSlide() {

    showSlide(currentSlide - 1);

}


/* Auto slide every 3 seconds */

setInterval(function() {

    nextSlide();

}, 3000);


</script>
