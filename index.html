<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Izaho29</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    min-height: 100vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
}

/* PROFILE */

.profile {
    text-align: center;
    padding: 28px 20px 18px;
}

.profile-image {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #fff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.18);
}

.name {
    margin-top: 12px;
    font-size: 24px;
    font-weight: 700;
}

.verified {
    color: #1877f2;
    font-size: 17px;
}

.location {
    margin-top: 6px;
    color: #777;
    font-size: 14px;
}

.rating {
    margin-top: 7px;
    font-size: 14px;
    color: #555;
}

/* STATS */

.stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 15px 10px 20px;
    border-bottom: 1px solid #eee;
}

.stat {
    text-align: center;
    min-width: 80px;
}

.stat strong {
    display: block;
    font-size: 20px;
    font-weight: 700;
}

.stat span {
    color: #777;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
}

.stat-icon {
    font-size: 12px;
    line-height: 1;
}

/* AD */

.ad-box {
    margin: 10px 20px 20px;
    min-height: 110px;
    border-radius: 12px;
    background: #eeeeee;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.ad-box a {
    display: block;
    line-height: 0;
}

.ad-box img {
    display: block;
    width: 305px;
    height: 99px;
    max-width: 100%;
    object-fit: contain;
}

/* BUTTONS */

.buttons {
    display: flex;
    gap: 10px;
    padding: 0 20px;
}

.buttons button {
    flex: 1;
    border: none;
    padding: 13px 8px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.explicit {
    background: #222;
    color: #fff;
}

.live {
    background: #e53935;
    color: #fff;
}

/* FEATURED */

.featured {
    padding: 25px 20px 10px;
}

.featured-title {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 12px;
}

.slider {
    position: relative;
    width: 100%;
    height: 300px;
    overflow: hidden;
    border-radius: 14px;
    background: #eee;
}

.slide-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* SLIDER ARROWS */

.slider-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: white;
    font-size: 24px;
    cursor: pointer;
    z-index: 5;
}

.prev {
    left: 10px;
}

.next {
    right: 10px;
}

/* VIEW MORE */

.view-more {
    padding: 18px 20px 30px;
}

.join-button {
    width: 100%;
    border: none;
    background: #111;
    color: #fff;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

/* POPUP OVERLAY */

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.72);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* POPUP */

.popup {
    position: relative;
    width: 100%;
    max-width: 390px;
    background: #fff;
    border-radius: 18px;
    padding: 30px 22px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    animation: popupIn 0.2s ease-out;
}

@keyframes popupIn {
    from {
        transform: scale(0.92);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

.popup h2 {
    margin: 0 0 12px;
    font-size: 24px;
}

.popup p {
    color: #666;
    line-height: 1.5;
    margin-bottom: 22px;
    font-size: 15px;
}

/* CLOSE BUTTON */

.close {
    position: absolute;
    top: 9px;
    right: 10px;
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: #eee;
    color: #333;
    font-size: 25px;
    line-height: 30px;
    cursor: pointer;
}

/* POPUP BUTTON */

.popup-button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 25px;
    background: #111;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

/* MOBILE */

@media (max-width: 420px) {

    .stats {
        gap: 18px;
    }

    .slider {
        height: 270px;
    }

    .buttons button {
        font-size: 13px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- PROFILE -->

    <div class="profile">

        <img
            class="profile-image"
            src="iamge/profile.webp"
            alt="Izaho29">

        <div class="name">
            Izaho29 <span class="verified">✓</span>
        </div>

        <div class="location">
            🇺🇸 United States
        </div>

        <div class="rating">
            ⭐ 4.9
        </div>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <strong>165</strong>

            <span>
                <span class="stat-icon">🎬</span>
                Videos
            </span>
        </div>


        <div class="stat">
            <strong>340</strong>

            <span>
                <span class="stat-icon">🖼️</span>
                Pictures
            </span>
        </div>


        <div class="stat">
            <strong>18+</strong>

            <span>
                Content
            </span>
        </div>

    </div>


    <!-- AFFILIATE BANNER -->

    <div class="ad-box">

        <a
            href="https://t.ajrkmx3.com/421332/8780/32504?aff_sub=Page1&source=Facebook&file_id=610753&aff_sub5=SF_006OG000004lmDN&aff_sub4=AT_0002"
            target="_blank"
            rel="noopener">

            <img
                src="https://www.imglnkx.com/8780/009379E_JRKM_18_ALL_EN_55_L.gif"
                width="305"
                height="99"
                border="0"
                alt="Advertisement">

        </a>

    </div>


    <!-- MAIN BUTTONS -->

    <div class="buttons">

        <button
            class="explicit"
            onclick="openPopup()">

            🔞 Explicit Content

        </button>


        <button
            class="live"
            onclick="openPopup()">

            🔴 +18 Livestream

        </button>

    </div>


    <!-- FEATURED -->

    <div class="featured">

        <div class="featured-title">
            Featured Content
        </div>


        <div class="slider">

            <img
                id="slideImage"
                class="slide-image"
                src="iamge/images.jpg"
                alt="Featured">

            <button
                class="slider-arrow prev"
                onclick="prevSlide()">

                ‹

            </button>


            <button
                class="slider-arrow next"
                onclick="nextSlide()">

                ›

            </button>

        </div>

    </div>


    <!-- VIEW MORE -->

    <div class="view-more">

        <button
            class="join-button"
            onclick="openPopup()">

            View More

        </button>

    </div>

</div>


<!-- 18+ POPUP -->

<div
    class="overlay"
    id="popup">

    <div class="popup">

        <button
            class="close"
            onclick="closePopup()">

            ×

        </button>


        <h2>
            18+ Content
        </h2>


        <p>
            This page contains age-restricted content.
            Please confirm that you are 18 years or older
            to continue.
        </p>


        <button
            class="popup-button"
            onclick="closePopup()">

            Continue

        </button>

    </div>

</div>


<script>

/* =========================
   POPUP
========================= */

function openPopup() {

    document.getElementById("popup").style.display = "flex";

}


function closePopup() {

    document.getElementById("popup").style.display = "none";

}


/* Close popup by clicking outside */

document.getElementById("popup").addEventListener("click", function(event) {

    if (event.target === this) {

        closePopup();

    }

});


/* =========================
   SLIDER
========================= */

const slides = [

    "iamge/images.jpg",
    "iamge/images (1).jpg",
    "iamge/images (2).jpg",
    "iamge/images (3).jpg"

];


let currentSlide = 0;


function showSlide(index) {

    if (index >= slides.length) {

        currentSlide = 0;

    }

    else if (index < 0) {

        currentSlide = slides.length - 1;

    }

    else {

        currentSlide = index;

    }


    document.getElementById("slideImage").src =
        slides[currentSlide];

}


function nextSlide() {

    showSlide(currentSlide + 1);

}


function prevSlide() {

    showSlide(currentSlide - 1);

}


/* Auto scroll every 3 seconds */

setInterval(function() {

    nextSlide();

}, 3000);

</script>

</body>
</html>
